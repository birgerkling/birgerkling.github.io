body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 18px; background: #0d0e14; color: #f4f2ff; font-family: system-ui, sans-serif; }

<script>
const canvas = document.querySelector('canvas');
const ctx = canvas.getContext('2d');
const clear = document.querySelector('#clear');
const again = document.querySelector('#again');
const roomLabel = document.querySelector('.room');
const floor = 324;
const initialGapLeft = 421;
const gapWidth = 127;
const gapShift = 98;
const fakeSpike = { x: 472, width: 22, height: 65 };
const spikeTraps = {
  3: { triggerX: 600, triggerEnd: 618, spikes: [{ x: 600, width: 18, height: 68 }] },
  4: { triggerX: 735, triggerEnd: 810, spikes: [{ x: 788, width: 22, height: 65 }] },
  5: {
    triggerX: fakeSpike.x,
    triggerEnd: fakeSpike.x + fakeSpike.width,
    spikes: [{ x: 585, width: fakeSpike.width * 5, height: fakeSpike.height }],
  },
};
const bridgeGap = { left: 245, right: 455 };
const secondGap = { left: 585, right: 713 };
const secondGapMiddle = (secondGap.left + secondGap.right) / 2;
const roomSevenGap = { left: 736, right: 834 };
const roomSevenReveal = 690;
const retractingSpikes = [
  0, 23, 46, 69,
  127, 151, 175, 199, 223, 247, 271, 295, 319, 343, 367, 391, 415, 437, 458,
].map(x => ({ x, width: 22, height: 65 }));
const middleSpike = { x: 480, width: 22, height: 65 };
const roomSevenFakes = [502, 525, 548, 571, 594, 617, 640, 663, 686, 709]
  .map(x => ({ x, width: 22, height: 65 }));
const roomEightGap = { left: 375, right: 587 };
const upperBridgeY = floor - 80;
const upperBridgeEntry = 180;
const upperBridgeGap = { left: 715, right: 810 };
const spikeBelowBridge = { x: 735, width: 58, height: 65 };
const startDoorX = 104;
const exitDoorX = 880;
const finalRoom = 10;
const stairsStart = { x: 0, width: 132, y: floor };
const stairsExit = { x: 855, width: 105, y: 142 };
const stairExitDoorX = 903;
const stairExitRevealX = 628;
const holeRimWidth = 20;
const stairFallSpeed = 34;
const stairSpawnInterval = 1.35;
let stairs = [];
let stairsTime = 0;
let stairsExitVisible = false;
const glitchDuration = 260;
const glitchColors = ['#c7ff76', '#e98dff', '#84eaff', '#a485e1'];
const glitchPixels = [
  [0, -5, 14, 3], [8, 5, 8, 2], [-11, 12, 12, 3], [17, -11, 6, 2],
  [-7, -19, 9, 2], [24, 15, 5, 3], [-19, 22, 7, 2], [12, 29, 10, 2],
];
const keys = new Set();
const touchKeys = new Map();
const heldKeyboardKeys = new Map();
if (navigator.maxTouchPoints > 0) document.documentElement.classList.add('touch-device');
const controls = new Map([
  ['KeyA', 'KeyA'], ['ArrowLeft', 'KeyA'],
  ['KeyD', 'KeyD'], ['ArrowRight', 'KeyD'],
  ['Space', 'Space'], ['ArrowUp', 'Space'],
]);
const dude = { x: 104, y: floor, vy: 0, grounded: true, facing: 1 };
let won = false;
let room = 1;
let gapLeft = initialGapLeft;
let flashUntil = 0;
let respawnDelay = 0;
let spikeRaised = false;
let secondGapOpen = false;
let upperBridgeAccess = false;
const trapGlitches = [];

function onInvisibleBridge() {
  return room === 6 && dude.x > bridgeGap.left && dude.x < bridgeGap.right;
}

function reset() {
  Object.assign(dude, { x: room === 9 ? 184 : startDoorX, y: floor, vy: 0, grounded: true, facing: 1 });
  gapLeft = initialGapLeft;
  spikeRaised = false;
  secondGapOpen = false;
  upperBridgeAccess = false;
  if (room === 10) {
    stairsTime = 0;
    stairsExitVisible = false;
    stairs = Array.from({ length: 10 }, (_, index) => ({
      number: index + 1, x: 158 + index * 68, width: 66,
      y: -13, visible: false,
      standing: 0, collapsed: false, spikeTime: 0, spikeUsed: false,
      holeTimer: null, holeOpen: false,
    }));
  }
  for (const spike of retractingSpikes) Object.assign(spike, { height: 65, lowered: false });
  trapGlitches.length = 0;
  respawnDelay = 0;
  flashUntil = 0;
  won = false;
  clear.hidden = true;
}

function enterRoom(number) {
  room = number;
  roomLabel.textContent = 'ROOM ' + String(room).padStart(3, '0');
  releaseControls();
  reset();
}

function press(key) {
  if (key === 'Space' && !keys.has(key) && dude.grounded && !won && !respawnDelay) {
    dude.grounded = false;
    if (onInvisibleBridge()) {
      dude.y = floor + 1;
      dude.vy = 0;
    } else {
      if (room === 8 && dude.y === floor) upperBridgeAccess = dude.x <= upperBridgeEntry;
      dude.vy = -610;
      burstGlitch(dude.x, -24, dude.y);
    }
  }
  keys.add(key);
}

window.addEventListener('keydown', event => {
  const key = controls.get(event.code);
  if (!key || (won && event.target === again)) return;
  event.preventDefault();
  if (event.repeat) return;
  heldKeyboardKeys.set(event.code, key);
  press(key);
});
window.addEventListener('keyup', event => {
  const key = heldKeyboardKeys.get(event.code);
  heldKeyboardKeys.delete(event.code);
  releaseKey(key);
});
function releaseKey(key) {
  if (key && !Array.from(heldKeyboardKeys.values()).includes(key) &&
      !Array.from(touchKeys.values()).includes(key)) keys.delete(key);
}
function releaseControls() {
  heldKeyboardKeys.clear();
  touchKeys.clear();
  keys.clear();
}
window.addEventListener('blur', releaseControls);
window.addEventListener('orientationchange', releaseControls);
function releaseTouches(event) {
  for (const touch of event.changedTouches) {
    const key = touchKeys.get(touch.identifier);
    touchKeys.delete(touch.identifier);
    releaseKey(key);
  }
}
window.addEventListener('touchend', releaseTouches);
window.addEventListener('touchcancel', releaseTouches);
again.addEventListener('click', () => enterRoom(1));
for (const button of document.querySelectorAll('[data-key]')) {
  button.addEventListener('touchstart', event => {
    event.preventDefault();
    for (const touch of event.changedTouches) touchKeys.set(touch.identifier, button.dataset.key);
    press(button.dataset.key);
  }, { passive: false });
  button.addEventListener('pointerdown', event => {
    if (event.pointerType === 'touch') return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    press(button.dataset.key);
  });
  button.addEventListener('lostpointercapture', () => releaseKey(button.dataset.key));
}

function update(dt) {
  if (won) return;
  if (respawnDelay > 0) {
    respawnDelay -= dt;
    if (respawnDelay <= 0) reset();
    return;
  }
  const direction = Number(keys.has('KeyD')) - Number(keys.has('KeyA'));
  if (direction) dude.facing = direction;
  dude.x = Math.max(14, Math.min(946, dude.x + direction * 275 * dt));
  if (room === 10) {
    updateStairs(dt);
    return;
  }
  if (room === 2 && gapLeft === initialGapLeft && dude.y < floor &&
      dude.x > gapLeft && dude.x < gapLeft + gapWidth) {
    gapLeft += gapShift;
    flashUntil = performance.now() + glitchDuration;
  }
  const openGap = room === 8 ? roomEightGap : room === 7 ? roomSevenGap : room === 6 ? secondGap :
    { left: gapLeft, right: gapLeft + gapWidth };
  if (!secondGapOpen && ((room === 6 && dude.x >= secondGapMiddle && dude.x < secondGap.right) ||
      (room === 7 && dude.x >= roomSevenReveal))) {
    secondGapOpen = true;
    burstGlitch(openGap.left, 28);
    burstGlitch(openGap.right, 28);
  }
  const hasOpenGap = room <= 3 || room === 8 || (room >= 6 && secondGapOpen);
  const aboveSolidFloor = !hasOpenGap || dude.x <= openGap.left || dude.x >= openGap.right;
  const overGround = aboveSolidFloor && (!onInvisibleBridge() || dude.grounded);
  const previousY = dude.y;
  let landed = false;
  const overBridgeGap = dude.x > upperBridgeGap.left && dude.x < upperBridgeGap.right;
  const overUpperBridge = room === 8 && upperBridgeAccess && previousY <= upperBridgeY && !overBridgeGap;
  const landingY = overUpperBridge ? upperBridgeY : floor;
  if (!overUpperBridge && (!overGround || previousY < floor)) dude.grounded = false;
  if (!dude.grounded) {
    dude.vy += 1650 * dt;
    dude.y += dude.vy * dt;
    if ((overGround || overUpperBridge) && dude.vy >= 0 && previousY <= landingY && dude.y >= landingY) {
      dude.y = landingY;
      dude.vy = 0;
      dude.grounded = true;
      landed = true;
    }
  }
  if (dude.y > 490 || (room === 8 && upperBridgeAccess && landed && dude.y === floor)) {
    reset();
    return;
  }
  const trap = spikeTraps[room];
  if (room === 8 && upperBridgeAccess && overBridgeGap && !spikeRaised) {
    spikeRaised = true;
    burstGlitch(spikeBelowBridge.x + spikeBelowBridge.width / 2, -spikeBelowBridge.height);
  }
  if (room === 8 && spikeRaised && hitsSpike(spikeBelowBridge)) {
    respawnDelay = 0.35;
    return;
  }
  if (trap && !spikeRaised && dude.x >= trap.triggerX && dude.x <= trap.triggerEnd && dude.y <= floor) {
    spikeRaised = true;
    for (const spike of trap.spikes) burstGlitch(spike.x + spike.width / 2, -spike.height);
  }
  if (trap && spikeRaised && trap.spikes.some(hitsSpike)) {
    respawnDelay = 0.35;
    return;
  }
  if (room === 7) {
    for (const spike of retractingSpikes) {
      const nearSpike = dude.x >= spike.x - 32 && dude.x <= spike.x + spike.width + 32;
      const lowered = dude.grounded && nearSpike;
      if (lowered !== spike.lowered) {
        spike.lowered = lowered;
        burstGlitch(spike.x + spike.width / 2, lowered ? 30 : -65);
      }
      const heightChange = lowered ? -1600 : 420;
      spike.height = Math.max(0, Math.min(65, spike.height + heightChange * dt));
    }
    const landedOnSpikes = landed && retractingSpikes.some(spike =>
      dude.x >= spike.x && dude.x <= spike.x + spike.width);
    if (hitsSpike(middleSpike) || landedOnSpikes) {
      respawnDelay = 0.35;
      return;
    }
  }
  const exitY = room === 8 ? upperBridgeY : floor;
  const goalDoorX = room === 9 ? startDoorX : exitDoorX;
  if (dude.grounded && dude.y === exitY && Math.abs(dude.x - goalDoorX) <= 31) {
    if (room < finalRoom) {
      enterRoom(room + 1);
      return;
    }
    won = true;
    clear.hidden = false;
    again.focus();
  }
}

function updateStairs(dt) {
  stairsTime += dt;
  if (!stairsExitVisible && dude.x >= stairExitRevealX) {
    stairsExitVisible = true;
    burstGlitch(stairExitDoorX, -65, stairsExit.y);
  }
  const previousY = dude.y;
  const holeStep = stairs[6];
  if (holeStep.holeTimer !== null && !holeStep.holeOpen) {
    holeStep.holeTimer -= dt;
    if (holeStep.holeTimer <= 1e-6) {
      holeStep.holeOpen = true;
      burstGlitch(holeStep.x + holeStep.width / 2, 30, holeStep.y);
    }
  }
  let support = null;
  for (const platform of [stairsStart, ...stairs, stairsExit]) {
    if (platform === stairsExit && !stairsExitVisible) continue;
    const oldY = platform.y;
    if (platform.number) {
      if (!platform.visible && stairsTime >= (platform.number - 1) * stairSpawnInterval) {
        platform.visible = true;
        burstGlitch(platform.x + platform.width / 2, 20, 0);
      }
      if (!platform.visible) continue;
      if (platform.collapsed) {
        platform.y += 920 * dt;
        continue;
      }
      platform.y += stairFallSpeed * dt;
      if (platform.y > canvas.height) continue;
    }
    if (dude.x < platform.x || dude.x > platform.x + platform.width) continue;
    if (platform.holeOpen && dude.x > platform.x + holeRimWidth &&
        dude.x < platform.x + platform.width - holeRimWidth) continue;
    if (dude.grounded && previousY === oldY) support = platform;
    if (!dude.grounded && dude.vy >= 0 && previousY <= oldY &&
        previousY + (dude.vy + 1650 * dt) * dt >= platform.y) support = platform;
  }
  if (support) {
    dude.y = support.y;
    dude.vy = 0;
    dude.grounded = true;
  } else {
    dude.grounded = false;
    dude.vy += 1650 * dt;
    dude.y += dude.vy * dt;
  }
  const fragile = stairs[2];
  if (support === holeStep && holeStep.holeTimer === null) holeStep.holeTimer = 0.3;
  fragile.standing = support === fragile ? fragile.standing + dt : 0;
  if (!fragile.collapsed && fragile.standing > 1 + 1e-6) {
    fragile.collapsed = true;
    burstGlitch(fragile.x + fragile.width / 2, 44, fragile.y);
  }
  for (const platform of [stairs[3], stairs[4]]) {
    platform.spikeTime = Math.max(0, platform.spikeTime - dt);
    const spike = stairSpike(platform);
    if (support === platform && !platform.spikeUsed) {
      platform.spikeUsed = true;
      platform.spikeTime = 0.5;
      burstGlitch(spike.x + spike.width / 2, -spike.height, platform.y);
    }
    if (platform.spikeTime > 0 && hitsSpike(spike)) {
      respawnDelay = 0.35;
      return;
    }
  }
  const edgeStep = stairs[5];
  if (support === edgeStep && !edgeStep.spikeUsed) {
    edgeStep.spikeUsed = true;
    for (const spike of edgeSpikes(edgeStep)) burstGlitch(spike.x + spike.width / 2, -35, edgeStep.y);
  }
  if (edgeStep.spikeUsed && edgeSpikes(edgeStep).some(hitsSpike)) {
    respawnDelay = 0.35;
    return;
  }
  if (dude.y > 490 || (support === stairsStart && stairs.at(-1).y > canvas.height)) reset();
  if (support === stairsExit && Math.abs(dude.x - stairExitDoorX) <= 20) {
    won = true;
    clear.hidden = false;
    again.focus();
  }
}

function stairSpike(platform) {
  const width = 20;
  return { x: platform.x + platform.width - width, width, height: 35, base: platform.y };
}

function edgeSpikes(platform) {
  return [platform.x, platform.x + platform.width - 12]
    .map(x => ({ x, width: 12, height: 35, base: platform.y }));
}

function box(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function burstGlitch(x, travel, y = floor) {
  trapGlitches.push({ x, y, travel, end: performance.now() + glitchDuration });
}

function drawTrapGlitches(time) {
  while (trapGlitches.length && trapGlitches[0].end <= time) trapGlitches.shift();
  for (const { x, y, travel, end } of trapGlitches) {
    const remaining = (end - time) / glitchDuration;
    const progress = 1 - remaining;
    const jitter = Math.floor(progress * 9) % 2 ? 5 : -3;
    ctx.save();
    ctx.globalAlpha = remaining;
    glitchPixels.forEach(([offsetX, offsetY, width, height], index) => {
      const drift = index % 2 ? 1 : -1;
      box(x + offsetX + jitter + drift * progress * 20,
        y + offsetY * .6 + travel * progress, width, height,
        glitchColors[index % glitchColors.length]);
    });
    ctx.restore();
  }
}

function drawGapGlitch(time) {
  const remaining = (flashUntil - time) / glitchDuration;
  if (remaining <= 0) return;
  const progress = 1 - remaining;
  const jitter = Math.floor(progress * 9) % 2 ? 5 : -3;
  ctx.save();
  ctx.globalAlpha = remaining;
  for (const edge of [gapLeft, gapLeft + gapWidth]) {
    const trailingEdge = edge - gapShift * remaining;
    glitchPixels.forEach(([x, y, width, height], index) => {
      const origin = index % 2 ? edge : trailingEdge;
      box(origin + x + jitter, floor + y, width, height,
        glitchColors[index % glitchColors.length]);
    });
  }
  ctx.restore();
}

function door(x, label, accent, base = floor) {
  box(x - 37, base - 106, 74, 106, '#282339');
  box(x - 30, base - 98, 60, 98, accent);
  box(x - 26, base - 94, 52, 94, '#161322');
  box(x + 13, base - 44, 6, 6, accent);
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  ctx.fillStyle = accent;
  ctx.fillText(label, x, base - 118);
}

function hitsSpike(spike) {
  const peak = 1 - Math.abs((dude.x - spike.x) / spike.width * 2 - 1);
  const base = spike.base ?? floor;
  return spike.height > 0 && peak >= 0 && dude.y >= base - spike.height * peak && dude.y <= base;
}

function drawSpike(spike) {
  const base = spike.base ?? floor;
  ctx.fillStyle = '#ff638d';
  ctx.beginPath();
  ctx.moveTo(spike.x, base);
  ctx.lineTo(spike.x + spike.width / 2, base - spike.height);
  ctx.lineTo(spike.x + spike.width, base);
  ctx.closePath();
  ctx.fill();
}

function draw(time) {
  const visibleGaps = room === 8 ? [roomEightGap] :
    room === 7 ? (secondGapOpen ? [roomSevenGap] : []) :
    room === 6 ? (secondGapOpen ? [bridgeGap, secondGap] : [bridgeGap]) :
    room <= 3 ? [{ left: gapLeft, right: gapLeft + gapWidth }] : [];
  const backdrop = ctx.createLinearGradient(0, 0, 0, 420);
  backdrop.addColorStop(0, '#26203c');
  backdrop.addColorStop(1, '#12101d');
  box(0, 0, 960, 420, backdrop);
  for (let x = 0; x < 960; x += 40) box(x, 0, 1, 420, '#ffffff09');
  for (let y = 4; y < 420; y += 40) box(0, y, 960, 1, '#ffffff09');
  let start = 0;
  const floorSegments = room === 10 ? [] : [...visibleGaps, { left: canvas.width, right: canvas.width }];
  for (const gap of floorSegments) {
    const end = gap.left;
    box(start, floor, end - start, 96, '#322844');
    box(start, floor, end - start, 4, '#a485e1');
    for (let x = start + 16; x < end - 4; x += 22) box(x, floor + 14, 4, 4, '#665080');
    if (gap.right > end) box(end, floor, gap.right - end, 96, '#08070e');
    start = gap.right;
  }
  if (room === 10) {
    const voidShade = ctx.createLinearGradient(0, 340, 0, canvas.height);
    voidShade.addColorStop(0, '#08070e00');
    voidShade.addColorStop(1, '#08070e');
    box(0, 340, canvas.width, canvas.height - 340, voidShade);
    for (const platform of [stairsStart, ...stairs, stairsExit]) {
      if (platform === stairsExit && !stairsExitVisible) continue;
      if (platform.number && (!platform.visible || platform.y > canvas.height)) continue;
      const segments = platform.holeOpen
        ? [[platform.x, holeRimWidth], [platform.x + platform.width - holeRimWidth, holeRimWidth]]
        : [[platform.x, platform.width]];
      for (const [x, width] of segments) {
        box(x, platform.y, width, 13, '#322844');
        box(x, platform.y, width, 3, '#a485e1');
      }
      if (platform.spikeTime > 0) drawSpike(stairSpike(platform));
      if (platform.number === 6 && platform.spikeUsed) edgeSpikes(platform).forEach(drawSpike);
    }
  }
  drawGapGlitch(time);
  const trap = spikeTraps[room];
  if (room === 5) drawSpike(fakeSpike);
  if (room === 8 && spikeRaised) drawSpike(spikeBelowBridge);
  if (trap && spikeRaised) trap.spikes.forEach(drawSpike);
  if (room === 7) {
    retractingSpikes.forEach(drawSpike);
    drawSpike(middleSpike);
    roomSevenFakes.forEach(drawSpike);
  }
  drawTrapGlitches(time);
  door(startDoorX, 'START', '#bba4ec');
  if (room === 10) {
    if (stairsExitVisible) door(stairExitDoorX, 'UTGÅNG', '#c7ff76', stairsExit.y);
  }
  else if (room !== 9) door(exitDoorX, 'UTGÅNG', '#c7ff76', room === 8 ? upperBridgeY : floor);
  ctx.save();
  ctx.translate(dude.x, dude.y);
  const walking = dude.grounded && keys.has('KeyA') !== keys.has('KeyD');
  const stride = walking ? Math.sin(time / 65) * 7 : 0;
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText('DUDE', 0, -61);
  ctx.scale(dude.facing, 1);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, -44, 9, 0, Math.PI * 2);
  ctx.moveTo(0, -35); ctx.lineTo(0, -17);
  ctx.moveTo(-12, -23 - stride / 2); ctx.lineTo(0, -31); ctx.lineTo(12, -23 + stride / 2);
  ctx.moveTo(-8 - stride, -2); ctx.lineTo(0, -17); ctx.lineTo(8 + stride, dude.grounded ? -2 : -8);
  ctx.stroke();
  box(3, -46, 2, 2, '#fff');
  ctx.restore();
}

let last = performance.now();
let accumulated = 0;
const step = 1 / 120;
function frame(now) {
  accumulated += Math.min((now - last) / 1000, 0.05);
  last = now;
  while (accumulated >= step) {
    update(step);
    accumulated -= step;
  }
  draw(now);
  requestAnimationFrame(frame);
}
draw(last);
requestAnimationFrame(frame);
</script>
