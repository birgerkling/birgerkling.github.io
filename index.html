  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #35316d, #14132a 62%);
      color: #fff3cf;
      font-family: system-ui, sans-serif;
    }
    main { width: min(960px, 100% - 36px); margin: auto; padding: clamp(48px, 11vh, 130px) 0 64px; }

    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    a {
      display: block;
      overflow: hidden;
      border: 2px solid #ffffff42;
      border-radius: 24px;
      background: #23213c;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 12px 32px #0005;
    }
    a:hover, a:focus-visible { border-color: #ffe2a3; }
    a:focus-visible { outline: 3px solid #ffe2a3; outline-offset: 4px; }
    img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; padding: 12px; }
    .snack img { background: radial-gradient(ellipse, #a75623, #472837); }
    .garden img { background: radial-gradient(ellipse, #486442, #26333a); }
    .obby-art { display: grid; place-items: center; aspect-ratio: 16 / 10; background: radial-gradient(ellipse, #392952, #161322 72%); }
    .obby-door { position: relative; display: block; width: 19%; height: 52%; border: 4px solid #c7ff76; border-bottom-width: 6px; background: #161322; box-shadow: 0 0 24px #c7ff7655; }
    .obby-door::after { content: ""; position: absolute; top: 54%; right: 16%; width: 6px; height: 6px; background: #c7ff76; }
    .bloo-art { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; background: radial-gradient(ellipse, #4d458b, #211936 76%); font-size: clamp(54px, 12vw, 110px); }
    .bloo-art img { position: absolute; inset: 0; margin: auto; width: auto; height: 90%; max-width: 90%; aspect-ratio: 1; padding: 0; image-rendering: pixelated; filter: drop-shadow(0 8px 14px #160f2a88); }
    .label { display: flex; justify-content: space-between; gap: 8px; padding: 17px 20px; font-size: clamp(19px, 3vw, 30px); font-weight: 800; }
    @media (max-width: 550px) { nav { grid-template-columns: 1fr; } }
